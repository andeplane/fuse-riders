<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Fuse Riders — dimensional sprite concepts</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:36px;background:#051126;color:#eaf6ff;font:15px system-ui}h1{margin:0 0 8px;font-size:28px}p{margin:0 0 26px;color:#93afce}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}.card{padding:24px;border:1px solid #234562;border-radius:22px;background:radial-gradient(at 50% 35%,#18334c,#08182d);text-align:center}.hero{display:block;width:100%;max-width:280px;aspect-ratio:1;object-fit:contain;margin:auto}h2{font-size:14px;letter-spacing:3px;color:#a9edfa;margin:18px 0}.sizes{display:flex;align-items:end;justify-content:center;gap:34px}.sizes span{display:flex;flex-direction:column;align-items:center;gap:10px;font-size:12px;color:#93afce}img{object-fit:contain}footer{margin-top:22px;font-size:13px;color:#93afce}
</style>
<h1>A more tangible power-up set</h1>
<p>Metal, glass and contained energy · dimensional game-sprite exploration</p>
<div class="grid">
  <section class="card"><img class="hero" src="bomb.png" alt="Gunmetal bomb with glowing fuse"><h2>BOMB</h2><div class="sizes"><span><img src="bomb.png" width="34" height="34" alt="">34 px</span><span><img src="bomb.png" width="44" height="44" alt="">44 px</span><span><img src="bomb.png" width="88" height="88" alt="">88 px</span></div></section>
  <section class="card"><img class="hero" src="fuse.png" alt="Brass stopwatch with glass face"><h2>FUSE</h2><div class="sizes"><span><img src="fuse.png" width="34" height="34" alt="">34 px</span><span><img src="fuse.png" width="44" height="44" alt="">44 px</span><span><img src="fuse.png" width="88" height="88" alt="">88 px</span></div></section>
  <section class="card"><img class="hero" src="blast.png" alt="Copper blast amplifier with molten energy core"><h2>BLAST+</h2><div class="sizes"><span><img src="blast.png" width="34" height="34" alt="">34 px</span><span><img src="blast.png" width="44" height="44" alt="">44 px</span><span><img src="blast.png" width="88" height="88" alt="">88 px</span></div></section>
</div>
<footer>Concept alternatives. The committed smooth SVG set is still active in the game.</footer>
</html>

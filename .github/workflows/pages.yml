name: Deploy Pages
on:
  workflow_dispatch:
    inputs:
      revision:
        description: Exact current main SHA verified locally
        required: true
        type: string
      local_verification:
        description: Local test and visual verification evidence (no secrets)
        required: true
        type: string
  # After the backend, never beside it. Both used to start from the same CI run, and Pages finishes in a couple
  # of minutes while the Cloud Run build takes ten: for that gap the new frontend called routes the live backend
  # did not have, which a browser reports as a CORS error.
  workflow_run:
    workflows: [Deploy backend]
    branches: [main]
    types: [completed]
permissions:
  contents: read
  actions: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      revision: ${{ steps.revision.outputs.sha }}
    steps:
      - name: Resolve the verified revision and require it to still be on main
        id: revision
        uses: actions/github-script@v7
        env:
          VITE_API_ORIGIN: ${{ vars.VITE_API_ORIGIN }}
        with:
          script: |
            const manual = context.eventName === 'workflow_dispatch';
            // An automatic run publishes the revision the live backend reports, not the newest CI-verified one and
            // not whichever run triggered this: a frontend is only safe to publish once the backend it was built
            // against is serving. The backend deploys the newest CI-verified main revision, so this is that
            // revision or, while a newer one is still building, the one before it; that one's own backend
            // deployment triggers this workflow again.
            let sha = context.payload.inputs?.revision;
            if (!manual) {
              const origin = process.env.VITE_API_ORIGIN;
              if (!origin || new URL(origin).protocol !== 'https:' || new URL(origin).origin !== origin) throw new Error('Set repository variable VITE_API_ORIGIN to the exact verified Cloud Run HTTPS origin, without a path.');
              // The service scales to zero and nothing retries a failed Pages run until the next backend run, so ride
              // out a cold start or a transient 5xx instead of losing the release.
              let health;
              for (const wait of [0, 5000, 15000, 30000]) {
                await new Promise((resolve) => setTimeout(resolve, wait));
                health = await fetch(`${origin}/api/health`, { cache: 'no-store', signal: AbortSignal.timeout(30000) }).catch((error) => ({ ok: false, status: String(error) }));
                if (health.ok) break;
              }
              if (!health.ok) throw new Error(`Backend health returned ${health.status}; refusing to publish a frontend it may not serve.`);
              sha = (await health.json()).revision;
              if (!/^[a-f0-9]{40}$/.test(sha ?? '')) throw new Error('The live backend does not report its revision; deploy a backend that does before publishing.');
              // Look the revision's own CI runs up by commit and check the conclusion here: the runs API's `status`
              // filter is eventually consistent and has answered wrongly right after a completion.
              const { data } = await github.rest.actions.listWorkflowRuns({ ...context.repo, workflow_id: 'ci.yml', branch: 'main', event: 'push', head_sha: sha, per_page: 20 });
              const verified = data.workflow_runs.filter((r) => r.head_sha === sha && r.conclusion === 'success').sort((a, b) => b.run_number - a.run_number)[0];
              if (!verified) throw new Error(`No successful CI push run for the live backend revision ${sha}; refusing to publish it.`);
              core.setOutput('ci_run', String(verified.id));
            }
            if (!/^[a-f0-9]{40}$/.test(sha ?? '')) throw new Error('An exact full revision is required.');
            if (manual && !context.payload.inputs.local_verification?.trim()) throw new Error('Local verification evidence is required.');
            // The revision must still be on main — never publish one force-pushed away — but it need not still
            // be main's head. CI takes about twelve minutes and main moves faster than that during active
            // development, so demanding equality refused almost every verified revision and nothing deployed at
            // all. A newer commit's own run supersedes this one moments later, and the github-pages concurrency
            // group serialises them, so the worst case is a release a few commits behind rather than no release.
            const { data: onMain } = await github.rest.repos.compareCommitsWithBasehead({ ...context.repo, basehead: `${sha}...main` });
            if (onMain.status !== 'identical' && onMain.status !== 'ahead') throw new Error(`Revision ${sha} is not on main (${onMain.status}); refusing to publish it.`);
            core.setOutput('sha', sha);
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.revision.outputs.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Validate public API configuration
        env:
          VITE_API_ORIGIN: ${{ vars.VITE_API_ORIGIN }}
        run: |
          node --input-type=module <<'NODE'
          const raw = process.env.VITE_API_ORIGIN;
          if (!raw) throw new Error('Set repository variable VITE_API_ORIGIN to the verified Cloud Run HTTPS origin.');
          const url = new URL(raw);
          if (url.protocol !== 'https:' || url.origin !== raw) throw new Error('VITE_API_ORIGIN must be an exact HTTPS origin without a path.');
          NODE
      - run: pnpm install --frozen-lockfile
      - name: Build the checked revision for its Pages path
        env:
          VITE_API_ORIGIN: ${{ vars.VITE_API_ORIGIN }}
        run: pnpm build --base=/fuse-riders/
      - name: Record exact frontend artifact contents
        env:
          RELEASE_REVISION: ${{ steps.revision.outputs.sha }}
          VITE_API_ORIGIN: ${{ vars.VITE_API_ORIGIN }}
          CI_RUN_ID: ${{ steps.revision.outputs.ci_run }}
          VERIFICATION_MODE: ${{ github.event_name == 'workflow_dispatch' && 'local' || 'ci' }}
          LOCAL_VERIFICATION_NOTE: ${{ inputs.local_verification }}
        run: |
          mkdir -p artifacts
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';
          writeFileSync('dist/release.json', JSON.stringify({
            gitRevision: process.env.RELEASE_REVISION,
            verifiedCiRun: process.env.VERIFICATION_MODE === 'ci' ? process.env.CI_RUN_ID : null,
            sourceVerification: { mode: process.env.VERIFICATION_MODE, ...(process.env.VERIFICATION_MODE === 'local' ? { note: process.env.LOCAL_VERIFICATION_NOTE } : {}) },
            apiOrigin: process.env.VITE_API_ORIGIN,
            base: '/fuse-riders/',
            builtAt: new Date().toISOString()
          }, null, 2) + '\n');
          NODE
          find dist -type f -print0 | sort -z | xargs -0 sha256sum > artifacts/pages-files.sha256
          sha256sum artifacts/pages-files.sha256 > artifacts/pages-manifest.sha256
          cp dist/release.json artifacts/pages-release.json
          cat artifacts/pages-manifest.sha256 >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: pages-release-evidence-${{ steps.revision.outputs.sha }}
          path: |
            artifacts/pages-files.sha256
            artifacts/pages-manifest.sha256
            artifacts/pages-release.json
          retention-days: 30
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Reject superseded revision before publication
        uses: actions/github-script@v7
        env:
          RELEASE_REVISION: ${{ needs.build.outputs.revision }}
        with:
          script: |
            // Same rule as the build gate: still on main, not necessarily its head.
            const { data: onMain } = await github.rest.repos.compareCommitsWithBasehead({ ...context.repo, basehead: `${process.env.RELEASE_REVISION}...main` });
            if (onMain.status !== 'identical' && onMain.status !== 'ahead') throw new Error(`Revision ${process.env.RELEASE_REVISION} left main (${onMain.status}); refusing to publish it.`);
      - name: Deploy the previously uploaded artifact
        id: deployment
        uses: actions/deploy-pages@v4

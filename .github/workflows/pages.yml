name: Deploy Pages
on:
  workflow_dispatch:
    inputs:
      revision:
        description: Exact current main SHA verified locally
        required: true
        type: string
      local_verification:
        description: Local test and visual verification evidence (no secrets)
        required: true
        type: string
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
permissions:
  contents: read
  actions: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      revision: ${{ steps.revision.outputs.sha }}
    steps:
      - name: Resolve the verified revision and require it to still be on main
        id: revision
        uses: actions/github-script@v7
        with:
          script: |
            const manual = context.eventName === 'workflow_dispatch';
            // An automatic run publishes the newest CI-verified main revision, not whichever run triggered it.
            // CI runs for different commits overlap and finish out of order, and this concurrency group keeps
            // only one waiting run, so the trigger's own revision may be older than the published one or belong
            // to a run that was replaced. Resolving it here means a replaced run never loses a release.
            let sha = context.payload.inputs?.revision;
            if (!manual) {
              const { data } = await github.rest.actions.listWorkflowRuns({ ...context.repo, workflow_id: 'ci.yml', branch: 'main', event: 'push', status: 'success', per_page: 1 });
              sha = data.workflow_runs[0]?.head_sha;
              core.setOutput('ci_run', String(data.workflow_runs[0]?.id ?? ''));
            }
            if (!/^[a-f0-9]{40}$/.test(sha ?? '')) throw new Error('An exact full revision is required.');
            if (manual && !context.payload.inputs.local_verification?.trim()) throw new Error('Local verification evidence is required.');
            // The revision must still be on main — never publish one force-pushed away — but it need not still
            // be main's head. CI takes about twelve minutes and main moves faster than that during active
            // development, so demanding equality refused almost every verified revision and nothing deployed at
            // all. A newer commit's own run supersedes this one moments later, and the github-pages concurrency
            // group serialises them, so the worst case is a release a few commits behind rather than no release.
            const { data: onMain } = await github.rest.repos.compareCommitsWithBasehead({ ...context.repo, basehead: `${sha}...main` });
            if (onMain.status !== 'identical' && onMain.status !== 'ahead') throw new Error(`Revision ${sha} is not on main (${onMain.status}); refusing to publish it.`);
            core.setOutput('sha', sha);
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.revision.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Validate public API configuration
        env:
          VITE_API_ORIGIN: ${{ vars.VITE_API_ORIGIN }}
        run: |
          node --input-type=module <<'NODE'
          const raw = process.env.VITE_API_ORIGIN;
          if (!raw) throw new Error('Set repository variable VITE_API_ORIGIN to the verified Cloud Run HTTPS origin.');
          const url = new URL(raw);
          if (url.protocol !== 'https:' || url.origin !== raw) throw new Error('VITE_API_ORIGIN must be an exact HTTPS origin without a path.');
          NODE
      - run: npm ci
      - name: Build the checked revision for its Pages path
        env:
          VITE_API_ORIGIN: ${{ vars.VITE_API_ORIGIN }}
        run: npm run build -- --base=/fuse-riders/
      - name: Record exact frontend artifact contents
        env:
          RELEASE_REVISION: ${{ steps.revision.outputs.sha }}
          VITE_API_ORIGIN: ${{ vars.VITE_API_ORIGIN }}
          CI_RUN_ID: ${{ steps.revision.outputs.ci_run }}
          VERIFICATION_MODE: ${{ github.event_name == 'workflow_dispatch' && 'local' || 'ci' }}
          LOCAL_VERIFICATION_NOTE: ${{ inputs.local_verification }}
        run: |
          mkdir -p artifacts
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';
          writeFileSync('dist/release.json', JSON.stringify({
            gitRevision: process.env.RELEASE_REVISION,
            verifiedCiRun: process.env.VERIFICATION_MODE === 'ci' ? process.env.CI_RUN_ID : null,
            sourceVerification: { mode: process.env.VERIFICATION_MODE, ...(process.env.VERIFICATION_MODE === 'local' ? { note: process.env.LOCAL_VERIFICATION_NOTE } : {}) },
            apiOrigin: process.env.VITE_API_ORIGIN,
            base: '/fuse-riders/',
            builtAt: new Date().toISOString()
          }, null, 2) + '\n');
          NODE
          find dist -type f -print0 | sort -z | xargs -0 sha256sum > artifacts/pages-files.sha256
          sha256sum artifacts/pages-files.sha256 > artifacts/pages-manifest.sha256
          cp dist/release.json artifacts/pages-release.json
          cat artifacts/pages-manifest.sha256 >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: pages-release-evidence-${{ steps.revision.outputs.sha }}
          path: |
            artifacts/pages-files.sha256
            artifacts/pages-manifest.sha256
            artifacts/pages-release.json
          retention-days: 30
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Reject superseded revision before publication
        uses: actions/github-script@v7
        env:
          RELEASE_REVISION: ${{ needs.build.outputs.revision }}
        with:
          script: |
            // Same rule as the build gate: still on main, not necessarily its head.
            const { data: onMain } = await github.rest.repos.compareCommitsWithBasehead({ ...context.repo, basehead: `${process.env.RELEASE_REVISION}...main` });
            if (onMain.status !== 'identical' && onMain.status !== 'ahead') throw new Error(`Revision ${process.env.RELEASE_REVISION} left main (${onMain.status}); refusing to publish it.`);
      - name: Deploy the previously uploaded artifact
        id: deployment
        uses: actions/deploy-pages@v4

name: CD
# What a main push proves before it deploys: ci.yml's gate (format, lint, configuration, the build and the unit
# shards), the same checks a pull request waits on, run again on the merged commit. That is about two minutes.
# backend.yml starts on the same push, builds the image meanwhile and waits for this run to succeed before it
# changes anything in production (scripts/deploy-cloud.sh); Pages follows the backend.
#
# The heavy suite (coverage, the whole browser matrix, the whole-recording replays at full stride) is
# suite.yml's. It runs for the same push but beside the deployment, not in front of it: a red suite is a
# regression to fix forward, not a withheld release.
#
# One run per commit, and none replaces another: backend.yml waits for the run of its own commit, so a run
# cancelled for a newer push would fail that commit's deployment for nothing. The gate is six short jobs.
on:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: cd-${{ github.sha }}
  cancel-in-progress: false
jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      # A called workflow gets no more than its caller grants, and ci.yml's smoke job (skipped here) asks for this.
      issues: write

name: Deploy backend
# Starts on the main push itself, beside CD's gate rather than after it, so the image builds while the gate
# runs. Nothing in production changes before that gate has passed: scripts/deploy-cloud.sh submits the image
# build, then waits for the CD run of this exact commit to succeed before it applies configuration or rolls
# Cloud Run. A failed gate fails this run with nothing deployed.
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
  actions: read
  id-token: write
concurrency:
  # One deployment at a time, in push order: a newer push waits, and a still newer one replaces the waiting run.
  # The newest commit contains every older one, so the run that goes ahead deploys them all.
  group: cloud-run-gateway
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Verified beta resources; see docs/online/GCP-DEPLOY.md. None of these are secrets.
      GCP_REGION: europe-west1
      FIRESTORE_DATABASE_ID: fuse-riders
      ROOM_COLLECTION_PREFIX: fuse-production
      PUBSUB_TOPIC: fuse-riders-signalling
      ALLOWED_ORIGINS: https://fusegames.ai,https://www.fusegames.ai,https://andeplane.github.io
      CLOUD_RUN_SERVICE: fuse-riders-gateway
      ARTIFACT_REPOSITORY: fuse-riders
      BUILD_SOURCE_BUCKET: andershaf-87-fuse-riders-build
      RUNTIME_SERVICE_ACCOUNT: fuse-riders-runtime@andershaf-87.iam.gserviceaccount.com
      BUILD_SERVICE_ACCOUNT: fuse-riders-build@andershaf-87.iam.gserviceaccount.com
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # The path filter below diffs against the commit Cloud Run serves, however far back that is.
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      # Keyless federation: no service-account key is stored in this repository.
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/867594018708/locations/global/workloadIdentityPools/github/providers/fuse-riders
          service_account: fuse-riders-deployer@andershaf-87.iam.gserviceaccount.com
      # The runner image ships gcloud; installing another copy took about twenty seconds of every deployment.
      - uses: google-github-actions/setup-gcloud@v2
        with:
          skip_install: true
      # Path filter: a main push that changed nothing the backend is built from (documentation, CI,
      # browser scripts, tests) does not rebuild and roll Cloud Run. The list is
      # scripts/lib/backend-paths.ts; the comparison is with the commit Cloud Run really serves. The
      # service's `commit` label alone is not that (a rollout that never became ready has already
      # written it), so the label counts only when the last created revision is the ready one and
      # carries all of the traffic; then a change whose own run failed or was replaced is deployed by
      # the next run. Any doubt about what is served deploys, except one: when the revision that
      # carries all of the traffic was built from a commit strictly newer than this target (a stale
      # run after a local deploy and a failed rollout, or a pin), deploying would roll production
      # back, so the run skips. A manual dispatch always deploys, so an intended rollback still works.
      - name: Did anything the backend is built from change?
        id: changes
        run: pnpm exec tsx scripts/backend-changed.ts
        env:
          FORCE_DEPLOY: ${{ github.event_name == 'workflow_dispatch' }}
      - if: steps.changes.outputs.deploy == 'true'
        run: npm ci --prefix tools/firebase
      # The script re-checks that this revision is still on main, builds the committed source, waits for
      # this revision's CD gate to pass and only then deploys the resulting immutable digest.
      - if: steps.changes.outputs.deploy == 'true'
        run: ./scripts/deploy-cloud.sh
      - uses: actions/upload-artifact@v4
        if: always() && steps.changes.outputs.deploy == 'true'
        with:
          name: cloud-release-evidence-${{ github.sha }}
          path: |
            artifacts/cloud-release-*.json
            artifacts/config-release-*.json
          if-no-files-found: ignore
          retention-days: 30

name: Deploy backend
on:
  workflow_dispatch:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
permissions:
  contents: read
  actions: read
  id-token: write
concurrency:
  group: cloud-run-gateway
  cancel-in-progress: false
jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Verified beta resources; see docs/online/GCP-DEPLOY.md. None of these are secrets.
      GCP_REGION: europe-west1
      FIRESTORE_DATABASE_ID: fuse-riders
      ROOM_COLLECTION_PREFIX: fuse-production
      PUBSUB_TOPIC: fuse-riders-signalling
      ALLOWED_ORIGINS: https://andeplane.github.io
      CLOUD_RUN_SERVICE: fuse-riders-gateway
      ARTIFACT_REPOSITORY: fuse-riders
      BUILD_SOURCE_BUCKET: andershaf-87-fuse-riders-build
      RUNTIME_SERVICE_ACCOUNT: fuse-riders-runtime@andershaf-87.iam.gserviceaccount.com
      BUILD_SERVICE_ACCOUNT: fuse-riders-build@andershaf-87.iam.gserviceaccount.com
      GH_TOKEN: ${{ github.token }}
    steps:
      # Deploy the newest CI-verified main revision, not whichever run triggered this. CI runs for different
      # commits overlap and finish out of order, and this concurrency group keeps only one waiting run, so
      # the trigger's own revision may be older than the live one or belong to a run that was replaced.
      # Resolving the target here means a replaced or skipped run never loses a deployment.
      - name: Resolve the newest CI-verified main revision
        id: target
        env:
          TRIGGER_SHA: ${{ github.event.workflow_run.head_sha }}
          TRIGGER_RUN: ${{ github.event.workflow_run.run_number }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            sha="$GITHUB_SHA"
          else
            # Start from the run that triggered this, which is known to have passed, and only move forward to a
            # later passing run whose commit descends from it. The runs API's `status` filter is eventually
            # consistent and has answered with a months-old run right after a completion, so it is not used,
            # and whatever the listing says can never select something older than the trigger.
            sha="$TRIGGER_SHA"
            newer="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=main&event=push&per_page=50" --jq "[.workflow_runs[] | select(.conclusion == \"success\" and .run_number > $TRIGGER_RUN)] | max_by(.run_number) | .head_sha // empty" || true)"
            if [[ "$newer" =~ ^[a-f0-9]{40}$ && "$(gh api "repos/$GITHUB_REPOSITORY/compare/$sha...$newer" --jq .status || true)" == ahead ]]; then
              sha="$newer"
            fi
          fi
          [[ "$sha" =~ ^[a-f0-9]{40}$ ]] || { echo 'No CI-verified main revision found.' >&2; exit 1; }
          echo "Deploying $sha (triggered by ${TRIGGER_SHA:-manual dispatch})" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.sha }}
          persist-credentials: false
          # The path filter below diffs against the commit Cloud Run serves, however far back that is.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      # Keyless federation: no service-account key is stored in this repository.
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/867594018708/locations/global/workloadIdentityPools/github/providers/fuse-riders
          service_account: fuse-riders-deployer@andershaf-87.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      # Several CI runs can resolve to the same target, and an explicit local deployment can already be ahead
      # of CI. Neither is a failure: there is simply nothing newer to roll out. A manual dispatch always deploys.
      - name: Skip a target that is already live or older than the live revision
        id: live
        if: github.event_name == 'workflow_run'
        env:
          TARGET: ${{ steps.target.outputs.sha }}
        run: |
          live="$(gcloud run services describe "$CLOUD_RUN_SERVICE" --project=andershaf-87 --region="$GCP_REGION" --format='value(metadata.labels.commit)' || true)"
          action=deploy
          if [[ "$live" =~ ^[a-f0-9]{40}$ ]]; then
            status="$(gh api "repos/$GITHUB_REPOSITORY/compare/$TARGET...$live" --jq .status || true)"
            if [[ "$status" == identical || "$status" == ahead ]]; then action=skip; fi
          fi
          echo "Live revision ${live:-unknown}, target $TARGET: $action" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "action=$action" >> "$GITHUB_OUTPUT"
      # Path filter: a main push that changed nothing the backend is built from (documentation, CI,
      # browser scripts, tests) does not rebuild and roll Cloud Run. The list is
      # scripts/lib/backend-paths.ts; the comparison is with the commit Cloud Run really serves. The
      # service's `commit` label alone is not that (a rollout that never became ready has already
      # written it), so the label counts only when the last created revision is the ready one and
      # carries all of the traffic; then a change whose own run failed or was replaced is deployed by
      # the next run. A manual dispatch always deploys, and so does any doubt about what is served.
      - name: Did anything the backend is built from change?
        id: changes
        if: steps.live.outputs.action != 'skip'
        run: npx tsx scripts/backend-changed.ts
        env:
          FORCE_DEPLOY: ${{ github.event_name == 'workflow_dispatch' }}
      - if: steps.changes.outputs.deploy == 'true'
        run: npm ci --prefix tools/firebase
      # The script re-checks that this revision is still on main and that its CI run passed,
      # builds the committed source and deploys the resulting immutable digest.
      - if: steps.changes.outputs.deploy == 'true'
        run: ./scripts/deploy-cloud.sh
      - uses: actions/upload-artifact@v4
        if: always() && steps.changes.outputs.deploy == 'true'
        with:
          name: cloud-release-evidence-${{ steps.target.outputs.sha || github.sha }}
          path: |
            artifacts/cloud-release-*.json
            artifacts/config-release-*.json
          if-no-files-found: ignore
          retention-days: 30

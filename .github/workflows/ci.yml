name: CI
on:
  push:
    branches: [main]
  pull_request:
    # `labeled` is not a default type: without it, adding `full-ci` to an open pull
    # request would not start the browser matrix until the next push.
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded pull-request runs, but never a push run: a cancelled CI run has no
  # success conclusion, so cancelling main's run silently withholds every deployment for
  # that commit. Pending push runs still collapse to the newest, so no backlog forms.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  # The gate a pull request waits on: type checks, unit coverage and the build, about a
  # minute. Everything that needs a browser is in `e2e` below.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build
      - name: Save coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-evidence
          path: coverage/
          if-no-files-found: ignore
          retention-days: 7

  # The browser matrix: ~10 of CI's ~12 minutes, so it runs on the way to production
  # rather than in front of every push to a pull request. Deployment still waits for it:
  # pages.yml and backend.yml gate on this whole workflow's conclusion for a main push,
  # and a job skipped on a pull request does not affect that conclusion.
  #
  # Run it on a pull request before merging, for a change to the renderer, the online
  # runtime, the controller or any other browser-facing path: add the `full-ci` label,
  # dispatch this workflow on the branch, or run `scripts/ci-local.sh` locally.
  e2e:
    if: >-
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'full-ci')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # A two-core runner drives several browser contexts at once, some on software GL, so the
      # deadlines these smokes were written against are not deadlines here: three different steps
      # timed out on three consecutive runs whose code was fine. Scaling them keeps every assertion
      # and removes the failures that only mean "the runner was busy". `timeout-minutes` above stays
      # the real stop, so a genuine hang still ends the job.
      SMOKE_TIMEOUT_SCALE: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Before the browser downloads, so a revision that does not compile fails in
      # seconds rather than after a minute of Playwright installs.
      - run: npm run build
      - run: npx playwright install --with-deps chrome chromium webkit
      - name: Chrome five-phone smoke
        run: npm run test:browser
      - name: WebKit five-phone smoke
        run: npm run test:browser
        env:
          BROWSER: webkit
      - name: Small-phone avatar picker layout
        run: npx tsx scripts/avatar-layout.ts
      # The production room protocol (src/service) over in-memory metadata, serving dist/.
      - name: Start local online room service
        run: |
          mkdir -p artifacts
          npx tsx src/service/dev.ts --port 8787 > artifacts/room-service.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:8787/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat artifacts/room-service.log
          exit 1
      - name: Desktop keyboard steering and firing
        run: npx tsx scripts/keyboard-smoke.ts
        env:
          HOME_URL: http://localhost:8787/
      # Compact desktop bar, ultrawide fit, resize recovery and the ? help — uncovered until #166 found it broken.
      - name: Desktop control bar and keyboard help
        run: npx tsx scripts/desktop-controls-smoke.ts
        env:
          ONLINE_URL: http://localhost:8787/
      # Keep five-peer functional assertions on Canvas; six software-GL views
      # overloaded the runner. Single-view Phaser remains a separate required gate.
      - name: Online WebRTC room smoke (Canvas)
        run: npx tsx scripts/online-smoke.ts
        env:
          ROOM_RENDERER: canvas
      - name: Online WebKit room smoke (Canvas)
        run: npx tsx scripts/online-smoke.ts
        env:
          SMOKE_RIDERS: 3
          BROWSER: webkit
          ROOM_RENDERER: canvas
      - name: Chrome Phaser lifecycle and fallback
        run: npx tsx scripts/phaser-browser.ts
      - name: WebKit Phaser lifecycle and fallback
        run: npx tsx scripts/phaser-browser.ts
        env:
          BROWSER: webkit
      - name: Landing, offline solo and mobile menus
        run: npx tsx scripts/home-mobile-smoke.ts
        env:
          HOME_URL: http://localhost:8787/
      - name: Landscape gameplay and touch zones
        run: npx tsx scripts/mobile-landscape-smoke.ts
        env:
          HOME_URL: http://localhost:8787/
      - name: One controller presentation across phone phases
        run: npx tsx scripts/mobile-phase-smoke.ts
        env:
          HOME_URL: http://localhost:8787/
      - name: Chrome end-of-match recap
        run: npx tsx scripts/match-recap-smoke.ts
        env:
          HOME_URL: http://localhost:8787/
      - name: WebKit end-of-match recap
        run: npx tsx scripts/match-recap-smoke.ts
        env:
          HOME_URL: http://localhost:8787/
          BROWSER: webkit
      - name: Shared QR lobby and room termination regression
        run: npx tsx scripts/shared-room-smoke.ts
        env:
          ONLINE_URL: http://localhost:8787/
      - name: Cross-engine determinism replay
        run: npx tsx scripts/determinism-replay.ts
      - name: Six-peer WebRTC mesh transport
        run: npx tsx scripts/p2p-mesh-browser.ts
        env:
          ONLINE_URL: http://localhost:8787/
      - name: Save browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-evidence
          path: |
            artifacts/*.png
            artifacts/room-service.log
            artifacts/shared-room-smoke.json
            docs/online/*benchmark.json
            docs/online/browser-network.json
          if-no-files-found: ignore
          retention-days: 7

name: CI
# The pull-request gate, kept under about two minutes. The heavy suite (coverage, the browser matrix and the
# whole-recording replays at full stride) is CD's: cd.yml runs this same workflow for main pushes, one run at a
# time, and both deployments wait for it. A pull request runs that suite too only when labelled `full-ci`.
on:
  pull_request:
    # `labeled` is not a default type: without it, adding `full-ci` to an open pull
    # request would not start the release jobs until the next push. `unlabeled` re-checks
    # `verify` when `full-ci` comes off.
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:
  # cd.yml. Called, `github.event_name` is the caller's (`push`), so the release jobs below run.
  workflow_call:
permissions:
  contents: read
concurrency:
  # Called from CD, `github.workflow` is "CD", whose own single group already serialises its runs.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded pull-request runs, never a CD run: a cancelled run withholds its deployment.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  # The pull-request gate is `checks` and the `unit` shards, side by side, with `verify` below as the one
  # check name to wait on. scripts/ci-manifest.json says which step belongs to which job, and
  # tests/ci-manifest.test.ts fails when these jobs stop matching it.
  #
  # What sets this gate's wall clock is mostly not its work. Measured over 25 green pull-request runs
  # (2026-10-11..17): the jobs' own work ended about 100-130 s after the run started, but `verify` finished at a
  # median of about 600 s and up to 40 minutes, because each job first waits for a runner. The account has about
  # 20 runners, shared with every other pull request and with CD, whose release jobs alone were about 25 jobs per
  # main push. So CD runs one main push at a time, its release jobs wait for this gate and the browser matrix is
  # capped (`max-parallel`), leaving runners free for pull requests; and this gate is shaped to need as few
  # runner slots and runner-seconds as it can for the same checks:
  #
  # - `checks` runs format, lint, configuration and `pnpm build` (`tsc --noEmit && vite build`, so it is the type
  #   check too) side by side in one job (scripts/ci-run.ts --job checks): each is mostly one core and a runner
  #   has four. It was two jobs taking 110 s and 60 s; it also hands its dist/ to the smokes, which each built it.
  # - `unit` shards are chosen by measured cost (scripts/lib/test-shards.ts, scripts/test-timings.json) rather
  #   than round-robin by index, which left eight shards between 12 s and 95 s on the same run. Balanced, five
  #   shards of about 60 s of tests each finish with `checks` (lint sets its floor), so more would add jobs to
  #   queue for no gain. Before changing the width, measure both halves: the shard balance
  #   AND how much queueing the extra jobs draw. Refresh the timings from a run's `test-timings-*` artifacts:
  #   `gh run download <run> -p 'test-timings-*' -D t && pnpm exec tsx scripts/run-tests.ts --merge-timings t`.
  #   Take them from a pull-request run: CD replays every tick, so its replay files look four times heavier.
  # - Every checkout leaves out the screenshots, videos and recorded evidence under docs/ (about 410 of the
  #   tree's 560 MB); nothing a check, test, build or smoke runs reads them. Coverage keeps its full checkout.
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/docs/**/*.png
            !/docs/**/*.jpg
            !/docs/**/*.gz
            !/docs/**/*.mp4
            !/games/*/docs/**/*.png
            !/docs/online/evidence/*.json
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Prettier's content-keyed cache (`format:check` passes --cache-strategy content): a file is skipped only
      # when its bytes, Prettier's version and the options all match a run that found it formatted, so this
      # changes the time, not the verdict. Restored from main's latest run on a pull request.
      - uses: actions/cache@v4
        with:
          path: node_modules/.cache/prettier
          key: prettier-${{ github.sha }}
          restore-keys: prettier-
      - run: pnpm exec tsx scripts/ci-run.ts --job checks
      # The smokes run this build rather than each making its own (22 builds of 30 s on every main push).
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          # "Re-run all jobs" keeps the run id, and a second upload under the same name would fail.
          overwrite: true

  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      # Every shard reports, so one run shows everything that is broken rather than the first thing.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    env:
      # scripts/run-tests.ts picks this shard's files by measured cost; `pnpm test` with no TEST_SHARD is still
      # the whole suite.
      TEST_SHARD: ${{ matrix.shard }}/5
      TEST_TIMINGS_OUT: artifacts/test-timings-${{ matrix.shard }}.json
      # The two whole-recording replays fold all 15,776 ticks either way; on a pull request they check one tick
      # in ten instead of every one, which is a quarter of the time. A main push and the release suite leave
      # this at 1 and check every tick. See games/fuse-riders/tests/fixtures/replay-budget.ts.
      FUSE_REPLAY_STRIDE: ${{ github.event_name == 'pull_request' && '10' || '1' }}
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/docs/**/*.png
            !/docs/**/*.jpg
            !/docs/**/*.gz
            !/docs/**/*.mp4
            !/games/*/docs/**/*.png
            !/docs/online/evidence/*.json
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-timings-${{ matrix.shard }}
          path: artifacts/test-timings-${{ matrix.shard }}.json
          if-no-files-found: ignore
          retention-days: 7
          overwrite: true

  # One stable check name for the whole gate: green only when `checks` and every shard passed and, when the release
  # jobs ran (CD, a dispatch or `full-ci`), coverage and every smoke passed too. A branch rule waits on this, never
  # on the shards, so the matrix can be resized without touching the rule. A red main does not hold pull requests
  # back: CD's failure withholds the deployment, and the fix forward merges like any other change.
  verify:
    needs: [checks, unit, coverage, e2e]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every gate passed
        env:
          GATE: ${{ needs.checks.result }} ${{ needs.unit.result }}
          RELEASE: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci') }}
          PROOF: ${{ needs.coverage.result }} ${{ needs.e2e.result }}
        run: |
          test "$GATE" = "success success"
          if [ "$RELEASE" = true ]; then
            test "$PROOF" = "success success" || { echo "::error::The release jobs did not pass (coverage, e2e: $PROOF)."; exit 1; }
          fi

  # The release jobs: coverage and the browser matrix. CD runs them for every main push it verifies, after the
  # gate above passed, and a pull request runs them only when labelled `full-ci`.
  coverage-unit:
    needs: [checks, unit]
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # Every share reports; `coverage` below needs all of them.
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      COVERAGE_PHASE: unit
      # One cost-balanced share of the unit files (scripts/test-coverage.ts); `coverage` merges them all.
      TEST_SHARD: ${{ matrix.shard }}/3
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-unit-raw-${{ matrix.shard }}
          path: coverage/tmp/
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  coverage-browser:
    needs: [checks, unit]
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # Every share reports; `coverage` below needs all of them.
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      COVERAGE_PHASE: browser
      # One cost-balanced share of the browser flows (scripts/test-coverage.ts); `coverage` merges them all.
      TEST_SHARD: ${{ matrix.shard }}/3
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chrome
      - run: pnpm test:coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-browser-raw-${{ matrix.shard }}
          path: coverage/tmp/
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  coverage:
    needs: [coverage-unit, coverage-browser]
    if: always() && (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COVERAGE_PHASE: report
    steps:
      - name: Require both coverage collectors
        env:
          UNIT: ${{ needs.coverage-unit.result }}
          BROWSER: ${{ needs.coverage-browser.result }}
        run: test "$UNIT $BROWSER" = "success success"
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Every share of both collectors into one directory, so the report and its thresholds see all of it.
      - uses: actions/download-artifact@v4
        with:
          pattern: coverage-unit-raw-*
          path: coverage/tmp/
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: coverage-browser-raw-*
          path: coverage/tmp/
          merge-multiple: true
      - run: pnpm test:coverage
      - name: Save coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-evidence
          path: coverage/
          if-no-files-found: ignore
          retention-days: 7

  # The browser matrix. It runs on the way to production rather than in front of every push to a
  # pull request. Deployment still waits for it: backend.yml (and Pages after it) gates on CD's
  # conclusion for a main push.
  #
  # Run it on a pull request before merging, for a change to the renderer, the online runtime,
  # the controller or any other browser-facing path: add the `full-ci` label, dispatch this
  # workflow on the branch, or run `scripts/ci-local.sh` locally.
  #
  # scripts/ci-manifest.json is the only list of smokes. `plan` reads it, `smoke` runs one job per
  # entry or per `batch` of short entries in parallel (its name, browsers, env and timeout all come from the entry), and `e2e`
  # is the single result a branch rule or a reader can wait on. scripts/ci-local.sh runs the same
  # entries through the same runner, and tests/ci-manifest.test.ts fails when this file stops
  # doing so.
  plan:
    needs: [checks, unit]
    if: >-
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'full-ci')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ids: ${{ steps.manifest.outputs.ids }}
      byId: ${{ steps.manifest.outputs.byId }}
    steps:
      - uses: actions/checkout@v4
      # One matrix job per batch of short smokes and per unbatched smoke (scripts/lib/ci-manifest.ts smokeJobs):
      # a batch's name joins its smokes', its browsers are their union and its timeout their sum.
      - name: Read the smokes from scripts/ci-manifest.json
        id: manifest
        run: |
          printf 'ids=%s\n' "$(jq -c '[.smokes[] | .batch // .id] | unique' scripts/ci-manifest.json)" >> "$GITHUB_OUTPUT"
          printf 'byId=%s\n' "$(jq -c '.smokes | group_by(.batch // .id) | map({key: (.[0].batch // .[0].id), value: {name: (map(.name) | join(" + ")), browsers: (map(.browsers[]) | unique), timeoutMinutes: (map(.timeoutMinutes) | add)}}) | from_entries' scripts/ci-manifest.json)" >> "$GITHUB_OUTPUT"

  smoke:
    # `checks` builds dist/ once for every smoke; the room service serves it.
    needs: [plan, checks]
    # The matrix is the ids alone and the job has no dynamic `name:`, so it reads `smoke (online-chrome)`
    # when it runs and plain `smoke` when a pull request without `full-ci` skips it. Everything else about
    # an entry is looked up by id.
    runs-on: ubuntu-latest
    strategy:
      # Every smoke reports, so one run shows everything that is broken rather than the first thing.
      fail-fast: false
      # Leaves runners for pull requests' gates while CD runs: with coverage's six collectors this is twelve of
      # the account's twenty. The longest smokes sort early (`home`, `determinism`), so the cap costs CD a minute
      # or two rather than a wave.
      max-parallel: 6
      matrix:
        id: ${{ fromJson(needs.plan.outputs.ids) }}
    # Setup plus the smoke, which may run twice (scripts/ci-smoke.sh).
    timeout-minutes: ${{ fromJson(needs.plan.outputs.byId)[matrix.id].timeoutMinutes }}
    permissions:
      contents: read
      # scripts/ci-smoke.sh comments on the `flaky-test` issue when a smoke on main passes only on retry.
      issues: write
    env:
      # Only main pushes report flakes to the issue, so pull-request smoke code never sees an issue-writing token.
      GH_TOKEN: ${{ github.event_name == 'push' && github.token || '' }}
      # A two-core runner drives several browser contexts at once, some on software GL, so the
      # deadlines these smokes were written against are not deadlines here: three different steps
      # timed out on three consecutive runs whose code was fine. Scaling them keeps every assertion
      # and removes the failures that only mean "the runner was busy". `timeout-minutes` above stays
      # the real stop, so a genuine hang still ends the job.
      SMOKE_TIMEOUT_SCALE: 3
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/docs/**/*.png
            !/docs/**/*.jpg
            !/docs/**/*.gz
            !/docs/**/*.mp4
            !/games/*/docs/**/*.png
            !/docs/online/evidence/*.json
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      # `--with-deps` apt-installs the browsers' system libraries, about 110 MB that took 20 s to download in every
      # smoke job. apt keeps its downloads in a cached directory instead; it still verifies every package, and a
      # runner image whose package versions moved just downloads the new ones.
      - name: Keep apt's package downloads in a cached directory
        id: apt
        run: |
          echo "image=${ImageOS:-unknown}-${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"
          printf 'Dir::Cache::Archives "%s";\nBinary::apt::APT::Keep-Downloaded-Packages "true";\n' "$HOME/apt-archives" | sudo tee /etc/apt/apt.conf.d/90-ci-archives
          mkdir -p "$HOME/apt-archives/partial"
      - uses: actions/cache@v4
        with:
          path: ~/apt-archives
          key: apt-${{ steps.apt.outputs.image }}-${{ join(fromJson(needs.plan.outputs.byId)[matrix.id].browsers, '-') }}
      - run: pnpm exec playwright install --with-deps ${{ join(fromJson(needs.plan.outputs.byId)[matrix.id].browsers, ' ') }}
      # apt leaves its lock and partial/ to root and _apt; the cache's post step saves the directory as the runner.
      - name: Hand apt's downloads back to the runner for the cache
        run: sudo chown -R "$(id -u):$(id -g)" "$HOME/apt-archives"
      # Starts the local room service on a free port when the smoke needs one (log in
      # artifacts/room-service.log), applies the entry's env and retries once through scripts/ci-smoke.sh.
      - name: ${{ fromJson(needs.plan.outputs.byId)[matrix.id].name }}
        run: pnpm exec tsx scripts/ci-run.ts --smoke "${{ matrix.id }}"
      - name: Save browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-evidence-${{ matrix.id }}
          path: |
            artifacts/*.png
            artifacts/room-service.log
            artifacts/flaky/*.log
            artifacts/shared-room-smoke.json
            artifacts/fuse-birds-cross-runtime.json
            docs/online/*benchmark.json
            docs/online/browser-network.json
          if-no-files-found: ignore
          retention-days: 7

  # One stable check name for the whole matrix: green only when every smoke passed.
  e2e:
    needs: [smoke]
    if: >-
      always() &&
      (github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'full-ci'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every smoke passed
        run: test "${{ needs.smoke.result }}" = success

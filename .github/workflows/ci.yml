name: CI
on:
  push:
    branches: [main]
  pull_request:
    # `labeled` is not a default type: without it, adding `full-ci` to an open pull
    # request would not start the browser matrix until the next push. `unlabeled` re-checks
    # `verify` when `cd-fix` comes off, so a stale pass cannot outlive the label.
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # One group per pushed commit: a shared main group lets only one run wait, so every further
  # merge cancelled the waiting run, and on a busy day most commits never got a CI conclusion
  # or a deployment. Push runs now overlap instead and each one completes.
  group: ci-${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  # Cancel superseded pull-request runs, but never a push run: a cancelled CI run has no
  # success conclusion, so cancelling main's run silently withholds that commit's deployment.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  # The pull-request gate is `checks` and the `unit` shards, side by side, with `verify` below as the one
  # check name to wait on. It used to be a single job running the same steps in series, which took about
  # seven minutes; three quarters of that was `test:coverage`, so coverage moved to `coverage` (main only)
  # and the tests were split into shards. scripts/ci-manifest.json says which step belongs to which job, and
  # tests/ci-manifest.test.ts fails when these jobs stop matching it.
  #
  # How wide to split it is a trade-off, and the runner side of it is not a fixed number. Do not read one
  # run and conclude anything: within three hours this gate saw a sixth job wait 38 s (which looked like a
  # five-runner cap and was not), then 17 jobs running at once on a main push, then every job waiting up to
  # 116 s on a ten-job gate. The pool is shared with every other workflow, so availability swings.
  #
  # What is stable is the work. On run 35514185047: slowest `unit` test step 37 s, `checks` 26 s, `build`
  # 19 s — about 40 s of critical path. Observed wall clock for the same gate ranges 58 s to 169 s, and the
  # difference is queueing, not tests.
  #
  # So more shards cut per-shard work but add jobs that each queue when the pool is busy, and past some
  # width that trade goes the wrong way. Eight was chosen on work alone (slowest shard at the pull-request
  # budget, locally on 4 cores: 3 shards 50.3 s, 4 shards 41.8 s, 6 shards 35.5 s, 8 shards 25.4 s — note 3
  # was worse than 4, because `node --test` splits files round-robin by index rather than by cost). Before
  # changing the width, measure both halves: the shard balance AND how much queueing the extra jobs draw.
  #
  # `pnpm build` is `tsc --noEmit && vite build`, so it is the type check; there is no separate step for it.
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm config:check

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      # Every shard reports, so one run shows everything that is broken rather than the first thing.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    env:
      # `node --test` splits the files; `pnpm test` with no TEST_SHARD is still the whole suite.
      TEST_SHARD: ${{ matrix.shard }}/8
      # The two whole-recording replays fold all 15,776 ticks either way; on a pull request they check one tick
      # in ten instead of every one, which is a quarter of the time. A main push and the release suite leave
      # this at 1 and check every tick. See games/fuse-riders/tests/fixtures/replay-budget.ts.
      FUSE_REPLAY_STRIDE: ${{ github.event_name == 'pull_request' && '10' || '1' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  # Whether main is red: its latest CI push run failed (which also withholds both deployments) or its latest
  # deployment failed. A pull request opened while main is red runs coverage and the whole browser matrix as if
  # it had `full-ci`, and `verify` requires them, so nothing merges on top of a broken main except a change
  # that leaves it green. A failed deployment also needs the `cd-fix` label: pull-request CI cannot show that a
  # deployment works. scripts/main-health.ts decides; on a push it does nothing and main counts as green.
  main-health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      red: ${{ steps.health.outputs.red }}
      deploy-red: ${{ steps.health.outputs.deploy-red }}
      reason: ${{ steps.health.outputs.reason }}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'pull_request'
      - uses: actions/setup-node@v4
        if: github.event_name == 'pull_request'
        with:
          node-version: 22
      - name: Is main red?
        id: health
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/main-health.ts

  # One stable check name for the whole gate: green only when every job above passed and, while main is red,
  # coverage and every smoke passed too. A branch rule waits on this, never on the shards, so the matrix can be
  # resized without touching the rule.
  verify:
    needs: [checks, build, unit, main-health, coverage, e2e]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every gate passed
        env:
          GATE: ${{ needs.checks.result }} ${{ needs.build.result }} ${{ needs.unit.result }} ${{ needs.main-health.result }}
          MAIN_RED: ${{ needs.main-health.outputs.red }}
          DEPLOY_RED: ${{ needs.main-health.outputs.deploy-red }}
          REASON: ${{ needs.main-health.outputs.reason }}
          PROOF: ${{ needs.coverage.result }} ${{ needs.e2e.result }}
          CD_FIX: ${{ contains(github.event.pull_request.labels.*.name, 'cd-fix') }}
        run: |
          test "$GATE" = "success success success success"
          if [ "$MAIN_RED" = true ]; then
            echo "Main is red: $REASON. A pull request merges now only if coverage and every smoke pass on top of main."
            test "$PROOF" = "success success" || { echo "::error::Main is red and this pull request does not make it green (coverage, e2e: $PROOF)."; exit 1; }
          fi
          if [ "$DEPLOY_RED" = true ] && [ "$CD_FIX" != true ]; then
            echo "::error::A main deployment failed ($REASON). Fix it first; a pull request that fixes it carries the cd-fix label."
            exit 1
          fi

  # The coverage gate: the same tests again with every module instrumented, which costs about 60% on top of
  # them. A pull request runs it only while main is red (`main-health`); a main push always does, before
  # anything deploys, and so does the release suite in AGENTS.md. The thresholds are in .c8rc.json and are not
  # relaxed here.
  coverage:
    needs: main-health
    if: github.event_name != 'pull_request' || needs.main-health.outputs.red == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:coverage
      - name: Save coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-evidence
          path: coverage/
          if-no-files-found: ignore
          retention-days: 7

  # The browser matrix. It runs on the way to production rather than in front of every push to a
  # pull request. Deployment still waits for it: pages.yml and backend.yml gate on this whole
  # workflow's conclusion for a main push, and jobs skipped on a pull request do not affect that
  # conclusion.
  #
  # Run it on a pull request before merging, for a change to the renderer, the online runtime,
  # the controller or any other browser-facing path: add the `full-ci` label, dispatch this
  # workflow on the branch, or run `scripts/ci-local.sh` locally. While main is red it runs on
  # every pull request, and `verify` requires it.
  #
  # scripts/ci-manifest.json is the only list of smokes. `plan` reads it, `smoke` runs one job per
  # entry in parallel (its name, browsers, env and timeout all come from the entry), and `e2e`
  # is the single result a branch rule or a reader can wait on. scripts/ci-local.sh runs the same
  # entries through the same runner, and tests/ci-manifest.test.ts fails when this file stops
  # doing so.
  plan:
    needs: main-health
    if: >-
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'full-ci') ||
      needs.main-health.outputs.red == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ids: ${{ steps.manifest.outputs.ids }}
      byId: ${{ steps.manifest.outputs.byId }}
    steps:
      - uses: actions/checkout@v4
      - name: Read the smokes from scripts/ci-manifest.json
        id: manifest
        run: |
          printf 'ids=%s\n' "$(jq -c '[.smokes[].id]' scripts/ci-manifest.json)" >> "$GITHUB_OUTPUT"
          printf 'byId=%s\n' "$(jq -c '.smokes | map({key: .id, value: .}) | from_entries' scripts/ci-manifest.json)" >> "$GITHUB_OUTPUT"

  smoke:
    needs: plan
    # The matrix is the ids alone and the job has no dynamic `name:`, so it reads `smoke (online-webkit)`
    # when it runs and plain `smoke` when a pull request without `full-ci` skips it. Everything else about
    # an entry is looked up by id.
    runs-on: ubuntu-latest
    strategy:
      # Every smoke reports, so one run shows everything that is broken rather than the first thing.
      fail-fast: false
      matrix:
        id: ${{ fromJson(needs.plan.outputs.ids) }}
    # Setup plus the smoke, which may run twice (scripts/ci-smoke.sh).
    timeout-minutes: ${{ fromJson(needs.plan.outputs.byId)[matrix.id].timeoutMinutes }}
    permissions:
      contents: read
      # scripts/ci-smoke.sh comments on the `flaky-test` issue when a smoke on main passes only on retry.
      issues: write
    env:
      # Only main pushes report flakes to the issue, so pull-request smoke code never sees an issue-writing token.
      GH_TOKEN: ${{ github.event_name == 'push' && github.token || '' }}
      # A two-core runner drives several browser contexts at once, some on software GL, so the
      # deadlines these smokes were written against are not deadlines here: three different steps
      # timed out on three consecutive runs whose code was fine. Scaling them keeps every assertion
      # and removes the failures that only mean "the runner was busy". `timeout-minutes` above stays
      # the real stop, so a genuine hang still ends the job.
      SMOKE_TIMEOUT_SCALE: 3
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Before the browser downloads, so a revision that does not compile fails in
      # seconds rather than after a minute of Playwright installs. The room service serves dist/.
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps ${{ join(fromJson(needs.plan.outputs.byId)[matrix.id].browsers, ' ') }}
      # Starts the local room service on a free port when the smoke needs one (log in
      # artifacts/room-service.log), applies the entry's env and retries once through scripts/ci-smoke.sh.
      - name: ${{ fromJson(needs.plan.outputs.byId)[matrix.id].name }}
        run: pnpm exec tsx scripts/ci-run.ts --smoke "${{ matrix.id }}"
      - name: Save browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-evidence-${{ matrix.id }}
          path: |
            artifacts/*.png
            artifacts/room-service.log
            artifacts/flaky/*.log
            artifacts/shared-room-smoke.json
            docs/online/*benchmark.json
            docs/online/browser-network.json
          if-no-files-found: ignore
          retention-days: 7

  # One stable check name for the whole matrix: green only when every smoke passed.
  e2e:
    needs: [main-health, smoke]
    if: >-
      always() &&
      (github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'full-ci') ||
      needs.main-health.outputs.red == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every smoke passed
        run: test "${{ needs.smoke.result }}" = success

name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build
      - run: npx playwright install --with-deps chrome webkit
      - name: Chrome five-phone smoke
        run: npm run test:browser
      - name: WebKit five-phone smoke
        run: npm run test:browser
        env:
          BROWSER: webkit
      - name: Small-phone avatar picker layout
        run: npx tsx scripts/avatar-layout.ts
      - name: Save coverage and browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-evidence
          path: |
            coverage/
            artifacts/*.png
          if-no-files-found: ignore
          retention-days: 7

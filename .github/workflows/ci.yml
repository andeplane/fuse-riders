name: CI
on:
  push:
    branches: [main]
  pull_request:
    # `labeled` is not a default type: without it, adding `full-ci` to an open pull
    # request would not start the browser matrix until the next push.
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # One group per pushed commit: a shared main group lets only one run wait, so every further
  # merge cancelled the waiting run, and on a busy day most commits never got a CI conclusion
  # or a deployment. Push runs now overlap instead and each one completes.
  group: ci-${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  # Cancel superseded pull-request runs, but never a push run: a cancelled CI run has no
  # success conclusion, so cancelling main's run silently withholds that commit's deployment.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  # The gate a pull request waits on: type checks, unit coverage and the build, about a
  # minute. Everything that needs a browser is in `e2e` below.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run config:check
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build
      - name: Save coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-evidence
          path: coverage/
          if-no-files-found: ignore
          retention-days: 7

  # The browser matrix: ~10 of CI's ~12 minutes, so it runs on the way to production
  # rather than in front of every push to a pull request. Deployment still waits for it:
  # pages.yml and backend.yml gate on this whole workflow's conclusion for a main push,
  # and a job skipped on a pull request does not affect that conclusion.
  #
  # Run it on a pull request before merging, for a change to the renderer, the online
  # runtime, the controller or any other browser-facing path: add the `full-ci` label,
  # dispatch this workflow on the branch, or run `scripts/ci-local.sh` locally.
  e2e:
    if: >-
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'full-ci')
    runs-on: ubuntu-latest
    # Each smoke may run twice (scripts/ci-smoke.sh), so the stop sits above the ~10-minute matrix doubled.
    timeout-minutes: 40
    permissions:
      contents: read
      # scripts/ci-smoke.sh comments on the `flaky-test` issue when a smoke on main passes only on retry.
      issues: write
    env:
      # Only main pushes report flakes to the issue, so pull-request smoke code never sees an issue-writing token.
      GH_TOKEN: ${{ github.event_name == 'push' && github.token || '' }}
      # A two-core runner drives several browser contexts at once, some on software GL, so the
      # deadlines these smokes were written against are not deadlines here: three different steps
      # timed out on three consecutive runs whose code was fine. Scaling them keeps every assertion
      # and removes the failures that only mean "the runner was busy". `timeout-minutes` above stays
      # the real stop, so a genuine hang still ends the job.
      SMOKE_TIMEOUT_SCALE: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Before the browser downloads, so a revision that does not compile fails in
      # seconds rather than after a minute of Playwright installs.
      - run: npm run build
      - run: npx playwright install --with-deps chrome chromium webkit
      # The production room protocol (packages/fuse-network-be) over in-memory metadata, serving dist/.
      - name: Start local online room service
        run: |
          mkdir -p artifacts
          npx tsx src/service/dev.ts --port 8787 > artifacts/room-service.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:8787/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat artifacts/room-service.log
          exit 1
      - name: Desktop keyboard steering and firing
        run: scripts/ci-smoke.sh "Desktop keyboard steering and firing" npx tsx scripts/keyboard-smoke.ts
        env:
          HOME_URL: http://localhost:8787/
      # Compact desktop bar, ultrawide fit, resize recovery and the ? help — uncovered until #166 found it broken.
      - name: Desktop control bar and keyboard help
        run: scripts/ci-smoke.sh "Desktop control bar and keyboard help" npx tsx scripts/desktop-controls-smoke.ts
        env:
          ONLINE_URL: http://localhost:8787/
      # Keep five-peer functional assertions on Phaser Canvas; six software-GL views
      # overloaded the runner. Single-view Phaser remains a separate required gate.
      - name: Online WebRTC room smoke (Phaser Canvas)
        run: scripts/ci-smoke.sh "Online WebRTC room smoke (Phaser Canvas)" npx tsx scripts/online-smoke.ts
        env:
          ROOM_RENDERER: phaser-canvas
      - name: Online WebKit room smoke (Phaser Canvas)
        run: scripts/ci-smoke.sh "Online WebKit room smoke (Phaser Canvas)" npx tsx scripts/online-smoke.ts
        env:
          SMOKE_RIDERS: 3
          BROWSER: webkit
          ROOM_RENDERER: phaser-canvas
      # The unit tests pin the charge ramp; this is the only thing that renders it, and a new room bounces by
      # default, so without it CI never draws the ramp most rooms actually use (#176).
      - name: Chrome bomb charge preview
        run: scripts/ci-smoke.sh "Chrome bomb charge preview" npx tsx scripts/bomb-preview-smoke.ts
      - name: WebKit bomb charge preview
        run: scripts/ci-smoke.sh "WebKit bomb charge preview" npx tsx scripts/bomb-preview-smoke.ts
        env:
          BROWSER: webkit
      - name: Chrome Phaser lifecycle and graphics retry
        run: scripts/ci-smoke.sh "Chrome Phaser lifecycle and graphics retry" npx tsx scripts/phaser-browser.ts
      - name: WebKit Phaser lifecycle and graphics retry
        run: scripts/ci-smoke.sh "WebKit Phaser lifecycle and graphics retry" npx tsx scripts/phaser-browser.ts
        env:
          BROWSER: webkit
      - name: Landing, offline solo and mobile menus
        run: scripts/ci-smoke.sh "Landing, offline solo and mobile menus" npx tsx scripts/home-mobile-smoke.ts
        env:
          HOME_URL: http://localhost:8787/
      - name: Landscape gameplay and touch zones
        run: scripts/ci-smoke.sh "Landscape gameplay and touch zones" npx tsx scripts/mobile-landscape-smoke.ts
        env:
          HOME_URL: http://localhost:8787/
      - name: One controller presentation across phone phases
        run: scripts/ci-smoke.sh "One controller presentation across phone phases" npx tsx scripts/mobile-phase-smoke.ts
        env:
          HOME_URL: http://localhost:8787/
      - name: Chrome end-of-match recap
        run: scripts/ci-smoke.sh "Chrome end-of-match recap" npx tsx scripts/match-recap-smoke.ts
        env:
          HOME_URL: http://localhost:8787/
      - name: WebKit end-of-match recap
        run: scripts/ci-smoke.sh "WebKit end-of-match recap" npx tsx scripts/match-recap-smoke.ts
        env:
          HOME_URL: http://localhost:8787/
          BROWSER: webkit
      - name: Shared QR lobby and room termination regression
        run: scripts/ci-smoke.sh "Shared QR lobby and room termination regression" npx tsx scripts/shared-room-smoke.ts
        env:
          ONLINE_URL: http://localhost:8787/
      - name: Cross-engine determinism replay
        run: scripts/ci-smoke.sh "Cross-engine determinism replay" npx tsx scripts/determinism-replay.ts
      - name: Six-peer WebRTC mesh transport
        run: scripts/ci-smoke.sh "Six-peer WebRTC mesh transport" npx tsx scripts/p2p-mesh-browser.ts
        env:
          ONLINE_URL: http://localhost:8787/
      - name: Save browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-evidence
          path: |
            artifacts/*.png
            artifacts/room-service.log
            artifacts/flaky/*.log
            artifacts/shared-room-smoke.json
            docs/online/*benchmark.json
            docs/online/browser-network.json
          if-no-files-found: ignore
          retention-days: 7

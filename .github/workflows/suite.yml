name: Release suite
# The heavy suite: ci.yml with its release jobs on (coverage, the whole browser matrix) and the whole-recording
# replays at full stride, run against main once a week and on a dispatch. It gates nothing: a deployment waits
# only for cd.yml's gate, so a failure here is a regression that is already live, to fix forward. A pull request
# runs the same jobs before it merges when labelled `full-ci`.
on:
  schedule:
    # Mondays 04:00 UTC. A scheduled run uses main's head.
    - cron: "0 4 * * 1"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-suite
  cancel-in-progress: false
jobs:
  ci:
    # A dispatch from another branch has `full-ci` on its pull request for that.
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml
    with:
      release: true
    permissions:
      contents: read
      # ci.yml's smokes comment on the `flaky-test` issue when a smoke on main passes only on retry.
      issues: write

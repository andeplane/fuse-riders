<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Fuse Birds · render verification</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #030b1d;
        color: #dcfff9;
        font: 14px monospace;
      }
      body {
        display: flex;
        flex-direction: column;
      }
      header,
      footer {
        padding: 16px 24px;
        display: flex;
        gap: 16px;
        align-items: center;
        flex-wrap: wrap;
      }
      header {
        border-bottom: 1px solid #1a354e;
      }
      strong {
        letter-spacing: 3px;
        color: #8bfff0;
      }
      #status {
        margin-left: auto;
        color: #9cacc6;
      }
      main {
        flex: 1;
        min-height: 0;
        position: relative;
      }
      canvas {
        width: 100%;
        height: 100%;
        display: block;
        touch-action: none;
      }
      button {
        background: #13223d;
        border: 1px solid #3b676f;
        border-radius: 7px;
        color: #d0fff3;
        font: inherit;
        padding: 10px 18px;
        cursor: pointer;
      }
      button[aria-pressed="true"] {
        border-color: #96fff0;
        background: #1b4652;
      }
      small {
        color: #9bafc7;
      }
      footer {
        border-top: 1px solid #1a354e;
      }
    </style>
  </head>
  <body>
    <header>
      <strong>FUSE BIRDS</strong
      ><small>Renderer verification · local rules</small
      ><span id="status">Loading artwork…</span>
    </header>
    <main>
      <canvas id="arena" aria-label="Fuse Birds battlefield"></canvas>
    </main>
    <footer>
      <button id="pebble" aria-pressed="true">Pebble ∞</button
      ><button id="scatter">Scatter Bomb ×3</button
      ><button id="pass">Pass</button><button id="zoom">Close-up</button
      ><button id="reset">New map</button
      ><small
        >Drag anywhere to pull the sling. Release to fire. Escape
        cancels.</small
      >
    </footer>
    <script type="module" src="./src/app/render-slice.ts"></script>
  </body>
</html>
